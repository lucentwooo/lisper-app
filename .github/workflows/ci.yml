name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15   # matches Package.swift platforms: [.macOS(.v15)] — pin, don't use macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: swift build

      # NOTE: `swift run LisperKitTests`, NOT `swift test`. Tests are an executable target
      # (see Package.swift) and this is the canonical runner per CLAUDE.md — using it keeps
      # CI and local identical.
      - name: Test
        run: swift run LisperKitTests
